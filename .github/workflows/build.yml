name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 7.6.3

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          mv app/build/outputs/apk/debug/app-debug.apk output/open-jarvis.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: output/open-jarvis.apk

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OpenJarvis v1.0.${{ github.run_number }}"
          body: |
            Release for OpenJarvis build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          file_path: output/open-jarvis.apk
          asset_name: open-jarvis.apk
          asset_content_type: application/vnd.android.package-archive
