name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          graduate-version: 8.2

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          mv app/build/outputs/apk/debug/app-debug.apk output/open-jarvis.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: output/open-jarvis.apk

      - name: Create GitHub Release
        uses: softprops/gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OpenJarvis v1.0.${{ github.run_number }}"
          files: output/open-jarvis.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
