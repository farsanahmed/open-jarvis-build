name: Build APK

on:
  push:
    branches: [main, '**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, gate and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: JVM unit tests
        run: |
          set -e
          ./gradlew testDebugUnitTest --stacktrace || {
            for f in app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] && cat "$f"
            done
            exit 1
          }

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/open-jarvis.apk

      - name: Manifest-vs-dex gate
        run: |
          chmod +x scripts/gate.sh
          scripts/gate.sh output/open-jarvis.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: output/open-jarvis.apk

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

  emulator:
    name: Emulator smoke test (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Run smoke and all-screens tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.openjarvis || true
            adb logcat -c || true
            adb shell monkey -p com.openjarvis -c android.intent.category.LAUNCHER 1 || true
            sleep 8
            adb shell pidof com.openjarvis
            adb shell settings put secure enabled_accessibility_services com.openjarvis/com.openjarvis.accessibility.JarvisAccessibilityService || true
            sleep 3
            adb shell pidof com.openjarvis
            adb logcat -d -v threadtime > logcat-api${{ matrix.api }}.txt || true
            if grep -E "FATAL EXCEPTION|ClassNotFoundException|NoClassDefFoundError" logcat-api${{ matrix.api }}.txt; then
              echo "SMOKE FAIL: fatal error in logcat"
              exit 1
            fi
            adb shell screencap -p /sdcard/screen-api${{ matrix.api }}.png
            adb pull /sdcard/screen-api${{ matrix.api }}.png screen-api${{ matrix.api }}.png
            ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api-${{ matrix.api }}
          path: logcat-api${{ matrix.api }}.txt

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-api-${{ matrix.api }}
          path: screen-api${{ matrix.api }}.png

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build, emulator]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: open-jarvis-apk
          path: output

      - name: Publish release v1.0.${{ github.run_number }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: OpenJarvis v1.0.${{ github.run_number }}
          prerelease: false
          files: output/open-jarvis.apk
