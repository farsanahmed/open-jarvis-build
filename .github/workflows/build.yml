name: Build APK

on:
  push:
    branches: [main, baseline]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Generate Gradle wrapper
        run: |
          GRADLE_HOME="/home/runner/work/_temp/.gradle-actions/gradle-installations/installs/gradle-8.5"
          export PATH="$GRADLE_HOME/bin:$PATH"
          $GRADLE_HOME/bin/gradle wrapper --gradle-version 8.5

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace --continue

      - name: Rename APK
        run: |
          mkdir -p output
          mv app/build/outputs/apk/debug/app-debug.apk output/open-jarvis.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-jarvis-apk
          path: output/open-jarvis.apk

      - name: Create GitHub Release
        id: create-release
        uses: actions/create-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "OpenJarvis v1.0.${{ github.run_number }}"
          body: |
            Release for OpenJarvis build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: output/open-jarvis.apk
          asset_name: open-jarvis.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            .gradle/
            **/*.log
